<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      id="theme-favicon"
      rel="icon"
      type="image/svg+xml"
      href="/images/icons/favicon.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content='The chain is a space. We shape reality on it. Essays, narratives, and philosophy from "Onchain Reality".'
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Onchain Reality" />
    <meta
      property="og:description"
      content='The chain is a space. We shape reality on it. Essays, narratives, and philosophy from "Onchain Reality".'
    />
    <meta property="og:site_name" content="Onchain Reality" />
    <meta property="og:image" content="/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Onchain Reality" />
    <meta
      name="twitter:description"
      content='The chain is a space. We shape reality on it. Essays, narratives, and philosophy from "Onchain Reality".'
    />
    <meta name="twitter:image" content="/images/og-image.png" />
    <title>Onchain Reality</title>
    <script>
      (function () {
        try {
          var k = "onchain-reality-theme";
          var t = localStorage.getItem(k);
          var theme = t === "light" || t === "dark" ? t : "dark";
          document.documentElement.dataset.theme = theme;
          document.getElementById("theme-favicon").href =
            theme === "light"
              ? "/images/icons/favicon-light.svg"
              : "/images/icons/favicon.svg";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
