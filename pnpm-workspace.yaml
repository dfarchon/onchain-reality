packages:
  - "."

# pnpm 12 reads supply-chain settings from this file (not .npmrc).
registry: https://registry.npmjs.org/
saveExact: true
autoInstallPeers: true
preferFrozenLockfile: true
lockfile: true
shamefullyHoist: false
strictDepBuilds: true
strictStorePkgContentCheck: true
verifyDepsBeforeRun: error
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Skip the downgrade check for releases older than 7 days. Exact pins from before
# those packages published provenance (netlify-cli, chokidar, …) stay installable.
# A publish from the last 7 days can still fail the check. minimumReleaseAge covers
# the first 24 hours.
trustPolicyIgnoreAfter: 10080
# Committed lockfile is the trusted base. Quarantine and trust apply to new resolutions.
trustLockfile: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
# Fail when the running pnpm is not the packageManager pin (Corepack).
pmOnFail: error
enableGlobalVirtualStore: false

# Patched transitive versions. Keep each line on a compatible release.
overrides:
  # <8.5.23 reads attacker-controlled sourceMappingURL paths (directory traversal).
  postcss: "8.5.23"
  # DoS via unbounded / zero-step expansion. Do not collapse 1.x/2.x onto 5.x.
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"
  # <1.16.1 can forward Authorization/Cookie on a cross-origin redirect.
  follow-redirects: "1.16.1"
  # <8.21.0 memory exhaustion from tiny frames (GHSA-96hv-2xvq-fx4p).
  ws: "8.21.3"
  # 3.3.11 is behind the patched 3.3 line.
  nanoid: "3.3.20"
  # front-matter depends on js-yaml 3.x. 3.14.2 is inside the merge-key DoS advisories (<3.15.2).
  "js-yaml@3": "3.15.2"

# Only these packages may run install/build lifecycle scripts.
allowBuilds:
  esbuild: true
  netlify-cli: true
  "@parcel/watcher": true
  sharp: true
  unix-dgram: true
